name: Deploy Plugin Site

# 插件画廊站：重新生成 site/ 并部署到 GitHub Pages
# https://your98k.github.io/Rule-Hub/

on:
  push:
    branches: [main]
    paths:
      - 'Loon/**'
      - 'Stash/**'
      - 'scripts/generate-site.cjs'
      - 'scripts/site-template.html'
      - '.github/workflows/deploy-site.yml'
  workflow_dispatch:
  schedule:
    # 每天 03:30 UTC 兜底部署（bot 提交的变更不会触发 push 事件）
    - cron: '30 3 * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # git log 取文件更新日期

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Generate site
        run: node scripts/generate-site.cjs --base https://your98k.github.io/Rule-Hub

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
