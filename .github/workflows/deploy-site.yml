name: Deploy Plugin Site

# 插件画廊站：重新生成 site/ 并部署到 GitHub Pages
# https://your98k.github.io/Rule-Hub/

on:
  push:
    branches: [main]
    paths:
      - 'Loon/**'
      - 'Stash/**'
      - 'scripts/generate-site.cjs'
      - 'scripts/site-template.html'
      - '.github/workflows/deploy-site.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # git log 取文件更新日期

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate site
        run: node scripts/generate-site.cjs --base https://your98k.github.io/Rule-Hub

      - name: Commit regenerated site data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- site/plugins.json site/index.html; then
            git add site/plugins.json site/index.html
            git commit -m "chore(site): regenerate plugins.json [skip ci]"
            git push
          else
            echo "site data unchanged"
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
