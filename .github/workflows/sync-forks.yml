name: Sync fork repositories

on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: account-fork-upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'your98k/Rule-Hub'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Safely merge each configured upstream without executing fork code
        shell: python
        env:
          SYNC_TOKEN: ${{ secrets.UPSTREAM_SYNC_TOKEN }}
          HUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          import datetime, json, os, urllib.error, urllib.parse, urllib.request

          # Keep credentials only in this trusted repository. Never check out or run fork code.
          targets = [
              ('your98k/dsh-purge', 'ZiPengWei/dsh-purge', 'upstream-sync'),
              ('your98k/dsh-purge-', 'kingcharleslzy-ai/dsh-purge', None),
              ('your98k/dsh-purge-safe', 'CallMeGuLab/dsh-purge-safe', None),
              ('your98k/gemini-playground', 'tech-shrimp/gemini-playground', None),
              ('your98k/rea', 'morluto/rea', None),
              ('your98k/wb2api-ios', 'chenyynx/wb2api-ios', None),
              ('your98k/yx-auto', 'byJoey/yx-auto', None),
          ]
          if not os.environ.get('SYNC_TOKEN'):
              raise SystemExit('UPSTREAM_SYNC_TOKEN is missing or expired.')
          quote = lambda value: urllib.parse.quote(value, safe='')

          def api(path, method='GET', payload=None, hub=False):
              token = os.environ['HUB_TOKEN' if hub else 'SYNC_TOKEN']
              request = urllib.request.Request(os.environ['GITHUB_API_URL'] + path,
                  data=None if payload is None else json.dumps(payload).encode(), method=method,
                  headers={'Authorization': 'Bearer ' + token,
                           'Accept': 'application/vnd.github+json',
                           'X-GitHub-Api-Version': '2022-11-28',
                           'Content-Type': 'application/json'})
              try:
                  with urllib.request.urlopen(request, timeout=60) as response:
                      body = response.read()
                      return json.loads(body) if body else {}
              except urllib.error.HTTPError as error:
                  raise RuntimeError('HTTP ' + str(error.code) + ': ' + error.read().decode()) from None

          results = ['## Fork upstream synchronization', '',
                     '| Repository | Upstream | Branch | Result |',
                     '| --- | --- | --- | --- |']
          failed = []
          for repo, expected_parent, configured_branch in targets:
              target = configured_branch or '(default)'
              try:
                  metadata = api('/repos/' + repo)
                  if not metadata.get('fork') or metadata.get('parent', {}).get('full_name') != expected_parent:
                      raise RuntimeError('Fork parent changed; refusing to switch upstream automatically.')
                  if metadata.get('archived') or metadata.get('disabled'):
                      raise RuntimeError('Target is archived or disabled; no repository settings were changed.')
                  source_branch = api('/repos/' + expected_parent)['default_branch']
                  target = configured_branch or metadata['default_branch']
                  source = api('/repos/' + expected_parent + '/git/ref/heads/' + quote(source_branch))['object']['sha']
                  before = api('/repos/' + repo + '/git/ref/heads/' + quote(target))['object']['sha']
                  compare = api('/repos/' + repo + '/compare/' + source + '...' + before)
                  missing = compare['behind_by']
                  if missing:
                      api('/repos/' + repo + '/merges', 'POST', {
                          'base': target, 'head': source,
                          'commit_message': 'chore: sync upstream ' + expected_parent + ':' + source_branch + ' [skip ci]'})
                  after = api('/repos/' + repo + '/git/ref/heads/' + quote(target))['object']['sha']
                  verified = api('/repos/' + repo + '/compare/' + source + '...' + after)
                  if verified['behind_by']:
                      raise RuntimeError('Post-merge ancestry verification failed.')
                  result = 'Already current' if not missing else 'Merged; ' + str(missing) + ' upstream commits'
                  print(repo + ':' + target + ' <- ' + expected_parent + ':' + source_branch + ': ' + result)
                  results.append('| `' + repo + '` | `' + expected_parent + '` | `' + target + '` | ' + result + ' |')
              except Exception as error:
                  message = str(error).replace('\n', ' ').replace('|', '/')
                  print('::error title=' + repo + '::' + message)
                  failed.append(repo)
                  results.append('| `' + repo + '` | `' + expected_parent + '` | `' + target + '` | BLOCKED: ' + message + ' |')

          # GitHub disables public-repository schedules after 60 days without activity.
          # A content-free commit after 45 days keeps this central schedule alive.
          try:
              hub = os.environ['GITHUB_REPOSITORY']
              metadata = api('/repos/' + hub, hub=True)
              branch = metadata['default_branch']
              head = api('/repos/' + hub + '/git/ref/heads/' + quote(branch), hub=True)['object']['sha']
              commit = api('/repos/' + hub + '/git/commits/' + head, hub=True)
              timestamp = datetime.datetime.fromisoformat(commit['committer']['date'].replace('Z', '+00:00'))
              if (datetime.datetime.now(datetime.timezone.utc) - timestamp).days >= 45:
                  keepalive = api('/repos/' + hub + '/git/commits', 'POST', {
                      'message': 'chore: keep upstream synchronization active [skip ci]',
                      'tree': commit['tree']['sha'], 'parents': [head]}, hub=True)
                  api('/repos/' + hub + '/git/refs/heads/' + quote(branch), 'PATCH', {
                      'sha': keepalive['sha'], 'force': False}, hub=True)
                  results += ['', 'Added a content-free keepalive commit after 45 inactive days.']
          except Exception as error:
              failed.append('schedule-keepalive')
              print('::error title=Schedule keepalive::' + str(error).replace('\n', ' '))
          results += ['', 'No force pushes, resets, deletions, or executions of upstream code are performed.',
                      'Merge conflicts and permission failures stop only the affected repository; other targets continue.',
                      'dsh-purge: master is intentionally preserved; rewritten upstream history is tracked in upstream-sync.']
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as output:
              output.write('\n'.join(results) + '\n')
          if failed:
              raise SystemExit('Blocked: ' + ', '.join(failed))
      - name: Safely synchronize verified template copies without disclosing private contents
        if: always()
        shell: python
        env:
          SYNC_TOKEN: ${{ secrets.UPSTREAM_SYNC_TOKEN }}
          TEMPLATE_CONFIG: ${{ secrets.UPSTREAM_TEMPLATE_CONFIG }}
        run: |
          import base64, json, os, urllib.error, urllib.parse, urllib.request
          from pathlib import PurePosixPath

          def api(path, method='GET', payload=None):
              request = urllib.request.Request(os.environ['GITHUB_API_URL'] + path,
                  data=None if payload is None else json.dumps(payload).encode(), method=method,
                  headers={'Authorization': 'Bearer ' + os.environ['SYNC_TOKEN'],
                           'Accept': 'application/vnd.github+json',
                           'X-GitHub-Api-Version': '2022-11-28',
                           'Content-Type': 'application/json'})
              try:
                  with urllib.request.urlopen(request, timeout=60) as response:
                      body = response.read()
                      return json.loads(body) if body else {}
              except urllib.error.HTTPError as error:
                  raise RuntimeError('GitHub API HTTP ' + str(error.code)) from None

          def tree(repo, ref):
              result = api('/repos/' + repo + '/git/trees/' + ref + '?recursive=1')
              if result.get('truncated'):
                  raise RuntimeError('Tree is truncated; refusing an incomplete comparison.')
              return {item['path']: (item['mode'], item['type'], item['sha'])
                      for item in result['tree'] if item['type'] != 'tree'}

          def plan(base, local, source, preserved):
              changes = {}
              for path in sorted(set(base) | set(source)):
                  if path in preserved or base.get(path) == source.get(path):
                      continue
                  if local.get(path) == source.get(path):
                      continue
                  if local.get(path) != base.get(path):
                      raise RuntimeError('Overlapping local and upstream changes; no files were overwritten.')
                  item = source.get(path)
                  if item and item[1] != 'blob':
                      raise RuntimeError('Changed submodules are not automatically imported.')
                  changes[path] = item
              return changes

          failed = []
          configs = json.loads(os.environ['TEMPLATE_CONFIG'])
          summaries = ['## Verified private template copies', '']
          for index, config in enumerate(configs, 1):
              label = 'Private template ' + str(index)
              try:
                  repo, upstream = config['repo'], config['upstream']
                  metadata = api('/repos/' + repo)
                  if not metadata.get('private'):
                      raise RuntimeError('Configured private target changed visibility; review required.')
                  branch = metadata['default_branch']
                  escaped = urllib.parse.quote(branch, safe='')
                  head = api('/repos/' + repo + '/git/ref/heads/' + escaped)['object']['sha']
                  commit = api('/repos/' + repo + '/git/commits/' + head)
                  local = tree(repo, commit['tree']['sha'])
                  state_path = '.github/upstream-template-sync.json'
                  state = None
                  if state_path in local:
                      blob = api('/repos/' + repo + '/git/blobs/' + local[state_path][2])
                      state = json.loads(base64.b64decode(blob['content']))
                      if state['source'] != upstream or state['preserve_local'] != config['preserve_local']:
                          raise RuntimeError('Recorded source or preservation policy changed; review required.')
                  baseline = state['upstream_commit'] if state else config['baseline']
                  if not state:
                      initial = api('/repos/' + repo + '/git/commits/' + config['local_initial'])
                      original = api('/repos/' + upstream + '/git/commits/' + baseline)
                      if initial['tree']['sha'] != original['tree']['sha']:
                          raise RuntimeError('Template baseline is not an exact original snapshot.')
                      ancestry = api('/repos/' + repo + '/compare/' + config['local_initial'] + '...' + head)
                      if ancestry['behind_by']:
                          raise RuntimeError('Original snapshot is not an ancestor of the target.')
                  source_meta = api('/repos/' + upstream)
                  source_branch = source_meta['default_branch']
                  source_head = api('/repos/' + upstream + '/git/ref/heads/' + urllib.parse.quote(source_branch, safe=''))['object']['sha']
                  base, source = tree(upstream, baseline), tree(upstream, source_head)
                  if state_path in source:
                      raise RuntimeError('Upstream attempted to use the reserved synchronization-state path.')
                  changes = plan(base, local, source, set(config['preserve_local']))
                  new_state = {'version': 1, 'source': upstream, 'upstream_commit': source_head,
                               'preserve_local': config['preserve_local']}
                  if not changes and state == new_state:
                      summaries.append('- ' + label + ': already current; local generated artifacts retained.')
                      continue
                  entries = []
                  for path, item in changes.items():
                      if item is None:
                          entries.append({'path': path, 'mode': local[path][0], 'type': 'blob', 'sha': None})
                      else:
                          blob = api('/repos/' + upstream + '/git/blobs/' + item[2])
                          copied = api('/repos/' + repo + '/git/blobs', 'POST', {
                              'encoding': 'base64', 'content': blob['content']})
                          if copied['sha'] != item[2]:
                              raise RuntimeError('Imported blob hash verification failed.')
                          entries.append({'path': path, 'mode': item[0], 'type': 'blob', 'sha': copied['sha']})
                  state_blob = api('/repos/' + repo + '/git/blobs', 'POST', {
                      'encoding': 'utf-8', 'content': json.dumps(new_state, indent=2) + '\n'})
                  entries.append({'path': state_path, 'mode': '100644', 'type': 'blob', 'sha': state_blob['sha']})
                  merged_tree = api('/repos/' + repo + '/git/trees', 'POST', {
                      'base_tree': commit['tree']['sha'], 'tree': entries})
                  merged = api('/repos/' + repo + '/git/commits', 'POST', {
                      'message': 'chore: safely synchronize verified template upstream [skip ci]',
                      'tree': merged_tree['sha'], 'parents': [head]})
                  api('/repos/' + repo + '/git/refs/heads/' + escaped, 'PATCH', {
                      'sha': merged['sha'], 'force': False})
                  verified = tree(repo, merged['sha'])
                  for path, item in changes.items():
                      if verified.get(path) != item:
                          raise RuntimeError('Post-write file verification failed.')
                  for path in set(local) - set(changes) - {state_path}:
                      if verified.get(path) != local[path]:
                          raise RuntimeError('An untouched file changed unexpectedly.')
                  summaries.append('- ' + label + ': synchronized ' + str(len(changes)) +
                                   ' upstream files; existing local edits and generated artifacts retained.')
              except Exception as error:
                  failed.append(label)
                  # Never print repository names, file paths, HTTP response bodies, or private contents.
                  message = str(error) if isinstance(error, RuntimeError) else type(error).__name__
                  print('::error title=' + label + '::' + message)
                  summaries.append('- ' + label + ': BLOCKED; no force push was performed.')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as output:
              output.write('\n'.join(summaries) + '\n')
          if failed:
              raise SystemExit(', '.join(failed) + ' blocked.')
